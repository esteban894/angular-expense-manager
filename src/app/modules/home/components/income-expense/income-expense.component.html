<h2 class="font-semibold">Ingresos y Gastos</h2>
<ng-container *ngIf="summary$ | async as summary">
  <div class="flex justify-between my-2">
    <h4>Ingresos</h4>
    <p>{{ formatCents(summary.income) }}</p>
  </div>
  <div class="flex justify-between my-2">
    <h4>Gastos</h4>
    <p>{{ formatCents(summary.expense) }}</p>
  </div>
</ng-container>
