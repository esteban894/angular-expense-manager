<main class="max-w-[1120px] mx-auto px-4 pt-7 pb-16 grid gap-5">
  <div class="flex flex-wrap items-end justify-between gap-2">
    <h1 class="font-display font-bold text-[clamp(24px,3vw,32px)] tracking-[-.02em] text-fg">
      Hola<ng-container *ngIf="name">, {{ name }}</ng-container>
    </h1>
  </div>
  <div class="grid md:grid-cols-[1fr_1.15fr] gap-5 items-start">
    <div class="grid gap-5 min-w-0">
      <app-summary-card />
      <div class="bg-surface border border-line rounded-card p-[22px] min-w-0">
        <app-transaction-form />
      </div>
    </div>
    <div class="bg-surface border border-line rounded-card p-[22px] min-w-0">
      <app-transaction-list />
    </div>
  </div>
</main>
