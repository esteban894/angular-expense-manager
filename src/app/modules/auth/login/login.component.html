<div class="grid gap-6">
  <div>
    <h2 class="font-display font-bold text-[28px] tracking-[-.02em]">Bienvenido de nuevo</h2>
    <p class="text-muted mt-1.5">Ingresa con tu email para ver tu balance.</p>
  </div>
  <form [formGroup]="form" novalidate (ngSubmit)="onSubmit()" class="grid gap-4">
    <div class="grid gap-1.5">
      <label for="email" class="text-[13px] font-semibold">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="tu@email.com"
        [attr.aria-invalid]="showError('email') ? 'true' : null"
        [attr.aria-describedby]="showError('email') ? 'err-email' : null"
        (blur)="onBlur('email')"
        class="w-full bg-surface text-fg border rounded-[10px] px-3 py-[11px] outline-none transition focus:border-accent focus:ring-[3px] focus:ring-accent-soft placeholder:text-muted/80"
        [ngClass]="showError('email') ? 'border-unn' : 'border-line'"
      />
      <div id="err-email" class="text-[13px] text-unn" aria-live="polite">{{ errorText('email') }}</div>
    </div>
    <div class="grid gap-1.5">
      <label for="password" class="text-[13px] font-semibold">Contraseña</label>
      <div class="relative flex items-center">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Mínimo 8 caracteres"
          [attr.aria-invalid]="showError('password') ? 'true' : null"
          [attr.aria-describedby]="showError('password') ? 'err-password' : null"
          (blur)="onBlur('password')"
          class="w-full bg-surface text-fg border rounded-[10px] px-3 py-[11px] outline-none transition focus:border-accent focus:ring-[3px] focus:ring-accent-soft placeholder:text-muted/80 pr-[76px]"
          [ngClass]="showError('password') ? 'border-unn' : 'border-line'"
        />
        <button
          type="button"
          id="toggle-pass"
          aria-controls="password"
          (click)="showPassword = !showPassword"
          class="absolute right-1.5 text-muted hover:text-fg px-2 py-1.5 text-[13px] rounded-md outline-none focus-visible:ring-2 focus-visible:ring-accent"
        >
          {{ showPassword ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>
      <div id="err-password" class="text-[13px] text-unn" aria-live="polite">{{ errorText('password') }}</div>
    </div>
    <div
      *ngIf="errorMessage"
      class="form-alert text-sm px-3 py-2.5 rounded-[10px] bg-unn-soft text-unn"
      role="alert"
    >
      {{ errorMessage }}
    </div>
    <button
      type="submit"
      id="auth-submit"
      [disabled]="pending"
      class="inline-flex items-center justify-center gap-2 rounded-[10px] px-4 py-3 font-semibold bg-accent text-accent-fg transition hover:brightness-110 active:translate-y-px disabled:opacity-70 disabled:cursor-progress"
    >
      {{ pending ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>
    <div class="flex items-center gap-3 text-muted text-xs uppercase tracking-[.08em]" aria-hidden="true">
      <span class="flex-1 h-px bg-line"></span>o<span class="flex-1 h-px bg-line"></span>
    </div>
    <button
      type="button"
      id="demo-login"
      [disabled]="pending"
      (click)="loginDemo()"
      class="inline-flex items-center justify-center rounded-[10px] px-4 py-3 font-semibold border border-line text-fg transition hover:border-muted disabled:opacity-70 disabled:cursor-progress"
    >
      Entrar con la cuenta demo
    </button>
  </form>
</div>
