<div role="status" aria-live="polite" aria-atomic="true">
  <div
    *ngIf="toast$ | async as t"
    data-testid="toast"
    (mouseenter)="setHovered(true)"
    (mouseleave)="setHovered(false)"
    (focusin)="setFocused(true)"
    (focusout)="setFocused(false)"
    class="fixed left-1/2 z-20 flex max-w-[calc(100%-32px)] -translate-x-1/2 items-center gap-3.5 rounded-xl bg-fg py-2.5 pl-4 pr-2.5 text-sm text-bg shadow-lg"
    style="bottom: calc(20px + env(safe-area-inset-bottom, 0px))"
  >
    <span>{{ t.message }}</span>
    <button
      *ngIf="t.action"
      type="button"
      (click)="run(t)"
      class="rounded px-1.5 py-1 font-semibold underline underline-offset-4 focus:outline-none focus-visible:ring-2 focus-visible:ring-bg"
    >
      {{ t.action.label }}
    </button>
  </div>
</div>
